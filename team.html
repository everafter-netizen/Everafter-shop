<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Everafter | الفريق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
/* Team dashboard behind a login: summary strip, order cards (designs + transfer proof), optional manual order form. */
:root{
  color-scheme:light;
  --bg:#f6f4f0; --surface:#ffffff; --fg:#141412; --muted:#66645e; --line:#dad6cc;
  --field:#f7f6f2; --accent:#141412; --accent-fg:#f6f4f0; --kraft:#d9c3a0; --kraft-soft:#efe5d3; --kraft-fg:#5b4524;
  --good:#2e6b45; --good-soft:#e0efe5; --danger:#b3261e; --danger-soft:#f8e1df; --shadow:0 1px 2px rgba(20,20,18,.06);
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.6;
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
#app{display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:1.3rem;text-wrap:balance}
h2{margin:0;font-size:1.05rem}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{display:flex;justify-content:center}
.brand img{display:block;width:100%;max-width:420px;height:auto}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:flex;flex-wrap:wrap;gap:6px 26px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat b{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.35}
.stat b.good{color:var(--good)}
.stat span{font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
form.card,#login{display:flex;flex-direction:column;gap:14px}
#login{max-width:420px;margin:0 auto;width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1 / -1}
.lbl,label{font-size:.88rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=email],input[type=password],input[type=tel],textarea,select{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:44px;
}
textarea{resize:vertical;min-height:64px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.drop{
  position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;max-height:160px;width:100%;
  border:1.5px dashed var(--line);border-radius:10px;background:var(--field);color:var(--muted);cursor:pointer;
  text-align:center;padding:6px;overflow:hidden;font-size:.85rem;
}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--fg)}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--field)}
.drop .cap{position:absolute;inset-inline:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:.76rem;padding:2px 6px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row input{flex:1 1 160px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--fg);display:inline-block}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);padding:10px 24px}
.btn.primary:disabled{opacity:.6;cursor:wait}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 12px;font-size:.88rem}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input{flex:1 1 200px;min-width:0}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 14px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.order{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.thumbs{display:grid;grid-template-columns:repeat(3,72px);gap:6px}
.thumbwrap{display:flex;flex-direction:column;gap:2px;align-items:center}
.thumbwrap small{font-size:.7rem;color:var(--muted)}
.thumb{
  width:72px;height:72px;border-radius:8px;border:1px solid var(--line);background:var(--field);padding:0;overflow:hidden;
  display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.72rem;cursor:pointer;text-align:center;
}
.thumb.proof{border-color:var(--good)}
.thumb.none{cursor:default;grid-column:1 / -1;width:auto;padding:0 10px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{display:flex;flex-direction:column;gap:8px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.name{font-weight:700;font-size:1.08rem;overflow-wrap:anywhere}
.chip{font-size:.8rem;font-weight:600;border-radius:999px;padding:0 10px;background:var(--kraft-soft);color:var(--kraft-fg)}
.chip.size{background:var(--accent);color:var(--accent-fg);font-weight:700}
.chip.late{background:var(--danger-soft);color:var(--danger)}
.chip.new{background:var(--good-soft);color:var(--good)}
.contact{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.92rem}
.contact bdi{font-variant-numeric:tabular-nums}
.nums{display:flex;flex-wrap:wrap;gap:4px 22px}
.num{display:flex;flex-direction:column;line-height:1.35}
.num span{font-size:.76rem;color:var(--muted)}
.num b{font-variant-numeric:tabular-nums}
.dates{display:flex;flex-wrap:wrap;gap:2px 18px;font-size:.88rem;color:var(--muted)}
.dates b{color:var(--fg);font-weight:600}
.notes{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-size:.82rem;font-weight:700;border-radius:999px;padding:1px 12px;border:1px solid var(--line);color:var(--muted);background:transparent;cursor:pointer}
.badge.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.sp{flex:1}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}
.note{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:8px 12px;font-size:.92rem}
#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--fg);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:.92rem;z-index:20;max-width:90vw;
}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.84);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .order{grid-template-columns:minmax(0,1fr)}
  .thumbs{grid-template-columns:repeat(3,84px)}
  .thumb{width:84px;height:84px}
}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.drop{transition:border-color .15s,color .15s}}
</style>
</head>

  <form id="login" class="card" novalidate>

  <div id="app" hidden>

        <button type="button" class="btn sm" id="logoutBtn">خروج</button>

    </div>

<script>
(function(){
  var FB_CFG = {"apiKey": "AIzaSyD4gPGXzD-metE3dB-mevoH8oOtEneHabU", "authDomain": "everafter-shop.firebaseapp.com", "projectId": "everafter-shop", "storageBucket": "everafter-shop.firebasestorage.app", "messagingSenderId": "505473791636", "appId": "1:505473791636:web:56451b691d451dfdfee681"};
  var FB_APP = 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
  var FB_FS = 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
  var FB_AUTH = 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
  var $ = function(id){return document.getElementById(id)};
  var fs = null, db = null, au = null, auth = null, unsub = null;
  var orders = [], loaded = false, filter = 'all', query = '';
  var editing = null, busy = false, confirmId = null, toastTimer = null;
  var KEYS = ['d0', 'd1', 'proof'], LABELS = ['ديزاين 1', 'ديزاين 2', 'صورة التحويل'];
  var slots = {}, slotEls = {};

  function h(tag, props){
    var e = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    for (var k in (props||{})){
      var v = props[k];
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    }
    (function add(list){
      list.forEach(function(c){
        if (Array.isArray(c)) return add(c);
        if (c == null || c === false) return;
        e.append(c.nodeType ? c : document.createTextNode(String(c)));
      });
    })(kids);
    return e;
  }
  function money(n){return (Number(n)||0).toLocaleString('en-US') + ' ج'}
  function fmtDate(s){
    if (!s) return '';
    var p = String(s).split('-');
    try{return new Date(+p[0], +p[1]-1, +p[2]).toLocaleDateString('ar-EG-u-nu-latn',{day:'numeric',month:'short'})}catch(e){return s}
  }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function num(v){var n = parseFloat(v); return isFinite(n) ? n : 0}
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){t.hidden = true}, 3400);
  }
  function notice(msg){var n = $('notice'); n.textContent = msg || ''; n.hidden = !msg}
  function withTimeout(p, ms){
    return Promise.race([p, new Promise(function(_, rej){setTimeout(function(){rej({code:'timeout'})}, ms)})]);
  }
  function waLink(phone){
    var d = String(phone || '').replace(/\D/g, '');
    if (!d) return '';
    if (d.indexOf('00') === 0) d = d.slice(2);
    else if (d.charAt(0) === '0') d = '20' + d.slice(1);
    return 'https://wa.me/' + d;
  }

  /* ---------- images ---------- */
  function toJpeg(file, max, q, limit){
    return new Promise(function(res, rej){
      var u = URL.createObjectURL(file), im = new Image();
      im.onload = function(){
        var w = im.naturalWidth, hh = im.naturalHeight, r = Math.min(1, max / Math.max(w, hh));
        w = Math.max(1, Math.round(w * r)); hh = Math.max(1, Math.round(hh * r));
        var c = document.createElement('canvas'); c.width = w; c.height = hh;
        var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, hh); x.drawImage(im, 0, 0, w, hh);
        URL.revokeObjectURL(u);
        var out = c.toDataURL('image/jpeg', q);
        while (limit && out.length > limit && q > 0.3){q -= 0.12; out = c.toDataURL('image/jpeg', q)}
        res(out);
      };
      im.onerror = function(){URL.revokeObjectURL(u); rej(new Error('bad image'))};
      im.src = u;
    });
  }
  function slotSrc(s){return s.file ? s.url : (s.t || null)}
  function updateSlot(k){
    var s = slots[k], el = slotEls[k], u = slotSrc(s);
    el.img.hidden = !u; el.cap.hidden = !u; el.text.hidden = !!u; el.rm.hidden = !u;
    if (u) el.img.src = u; else el.img.removeAttribute('src');
  }
  function setSlotFile(k, file){
    if (!file) return;
    if (!/^image\//.test(file.type)){toast('الملف لازم يكون صورة'); return}
    var s = slots[k];
    if (s.url) URL.revokeObjectURL(s.url);
    s.file = file; s.url = URL.createObjectURL(file); s.t = null; s.f = null;
    updateSlot(k);
  }
  function clearSlot(k){
    var s = slots[k];
    if (s.url) URL.revokeObjectURL(s.url);
    s.file = null; s.url = null; s.t = null; s.f = null;
    updateSlot(k);
  }
  function buildSlots(){
    var host = $('slots');
    KEYS.forEach(function(k, i){
      slots[k] = {file:null, url:null, t:null, f:null};
      var input = h('input', {type:'file', accept:'image/*', hidden:true, id:'file_' + k});
      var img = h('img', {alt:'', hidden:true});
      var text = h('span', {}, 'اختار صورة');
      var cap = h('span', {class:'cap', hidden:true}, 'غيّر');
      var drop = h('label', {class:'drop', for:'file_' + k}, img, text, cap);
      var rm = h('button', {type:'button', class:'btn sm', hidden:true, onclick:function(){clearSlot(k)}}, 'شيل');
      input.addEventListener('change', function(e){setSlotFile(k, e.target.files[0]); e.target.value = ''});
      ['dragenter','dragover'].forEach(function(n){drop.addEventListener(n, function(e){e.preventDefault(); drop.classList.add('over')})});
      ['dragleave','drop'].forEach(function(n){drop.addEventListener(n, function(e){e.preventDefault(); drop.classList.remove('over')})});
      drop.addEventListener('drop', function(e){setSlotFile(k, e.dataTransfer.files[0])});
      slotEls[k] = {img:img, text:text, cap:cap, rm:rm};
      host.append(h('div', {class:'slot'}, h('span', {class:'lbl'}, LABELS[i]), drop, input, rm));
    });
  }

  /* ---------- form ---------- */
  function showForm(on){$('f').hidden = !on}
  function resetForm(){
    editing = null;
    $('f').reset();
    KEYS.forEach(clearSlot);
    $('formTitle').textContent = 'طلب جديد';
    $('saveBtn').textContent = 'حفظ الطلب';
  }
  function startEdit(o){
    resetForm();
    editing = o;
    $('name').value = o.name || ''; $('phone').value = o.phone || ''; $('color').value = o.color || '';
    $('size').value = o.size || ''; $('price').value = o.price || '';
    $('payDate').value = o.payDate || ''; $('pickupDate').value = o.pickupDate || ''; $('notes').value = o.notes || '';
    var cur = {d0: (o.imgs || [])[0], d1: (o.imgs || [])[1], proof: o.proof};
    KEYS.forEach(function(k){
      var im = cur[k];
      if (im){slots[k].t = im.t || null; slots[k].f = im.f || null; updateSlot(k)}
    });
    $('formTitle').textContent = 'تعديل طلب ' + (o.name || '');
    $('saveBtn').textContent = 'حفظ التعديل';
    showForm(true);
    $('f').scrollIntoView({behavior:'smooth', block:'start'});
    $('name').focus();
  }
  function ordRef(id){return fs.doc(db, 'orders', id)}
  function imgRef(id){return fs.doc(db, 'images', id)}

  async function save(ev){
    ev.preventDefault();
    if (busy) return;
    var name = $('name').value.trim();
    if (!name){$('name').focus(); return}
    busy = true; $('saveBtn').disabled = true;
    try{
      var out = {};
      for (var i = 0; i < KEYS.length; i++){
        var k = KEYS[i], s = slots[k], max = k === 'proof' ? 1400 : 1100;
        if (s.file){
          var thumb = await toJpeg(s.file, 260, 0.72);
          var full = await toJpeg(s.file, max, 0.82, 800000);
          var fid = fs.doc(fs.collection(db, 'images')).id;
          await withTimeout(fs.setDoc(imgRef(fid), {data: full}), 30000);
          out[k] = {t: thumb, f: fid};
        } else if (s.t){
          out[k] = {t: s.t, f: s.f || null};
        } else {
          out[k] = null;
        }
      }
      var id = editing ? editing.id : fs.doc(fs.collection(db, 'orders')).id;
      var data = {
        name: name, phone: $('phone').value.trim(), color: $('color').value.trim(), size: $('size').value,
        notes: $('notes').value.trim(), price: Math.max(0, num($('price').value)),
        payDate: $('payDate').value || '', pickupDate: $('pickupDate').value || '',
        imgs: [out.d0, out.d1], proof: out.proof,
        done: editing ? !!editing.done : false, source: editing ? (editing.source || 'team') : 'team',
        createdAt: editing ? (editing.createdAt || Date.now()) : Date.now()
      };
      await withTimeout(fs.setDoc(ordRef(id), data), 30000);
      var keep = [];
      [out.d0, out.d1, out.proof].forEach(function(x){if (x && x.f) keep.push(x.f)});
      var olds = editing ? (editing.imgs || []).concat([editing.proof]).filter(Boolean) : [];
      for (var j = 0; j < olds.length; j++){
        if (olds[j].f && keep.indexOf(olds[j].f) < 0){try{await fs.deleteDoc(imgRef(olds[j].f))}catch(e){}}
      }
      toast(editing ? 'اتحفظ التعديل' : 'اتضاف الطلب');
      resetForm(); showForm(false);
    }catch(e){
      toast(e && e.code === 'timeout' ? 'مفيش اتصال بالنت، مش متأكدة إن الطلب اتحفظ' : 'معرفتش أحفظ، جرّبي تاني');
    }finally{
      busy = false; $('saveBtn').disabled = false;
    }
  }

  /* ---------- list ---------- */
  async function toggleDone(o){
    try{await fs.updateDoc(ordRef(o.id), {done: !o.done})}catch(e){toast('معرفتش أغيّر الحالة')}
  }
  async function remove(o){
    try{
      await fs.deleteDoc(ordRef(o.id));
      var ims = (o.imgs || []).concat([o.proof]).filter(Boolean);
      for (var i = 0; i < ims.length; i++){
        if (ims[i].f){try{await fs.deleteDoc(imgRef(ims[i].f))}catch(e){}}
      }
      if (editing && editing.id === o.id){resetForm(); showForm(false)}
      confirmId = null; toast('اتمسح الطلب');
    }catch(e){toast('معرفتش أمسح الطلب')}
  }
  async function openLightbox(im){
    $('lbImg').src = im.t; $('lb').hidden = false;
    if (!im.f) return;
    try{
      var snap = await fs.getDoc(imgRef(im.f));
      if (snap.exists() && !$('lb').hidden) $('lbImg').src = snap.data().data;
    }catch(e){}
  }
  function thumbs(o){
    var items = [];
    (o.imgs || []).forEach(function(im, i){if (im && im.t) items.push({im:im, label:'ديزاين ' + (i + 1), proof:false})});
    if (o.proof && o.proof.t) items.push({im:o.proof, label:'التحويل', proof:true});
    if (!items.length) return h('div', {class:'thumbs'}, h('div', {class:'thumb none'}, 'من غير صور'));
    return h('div', {class:'thumbs'}, items.map(function(it){
      return h('div', {class:'thumbwrap'},
        h('button', {type:'button', class:'thumb' + (it.proof ? ' proof' : ''), 'aria-label':'كبّري ' + it.label, onclick:function(){openLightbox(it.im)}},
          h('img', {src:it.im.t, alt:it.label + ' لطلب ' + (o.name || '')})),
        h('small', {}, it.label));
    }));
  }
  function card(o){
    var late = !o.done && o.pickupDate && o.pickupDate < todayStr();
    var wa = waLink(o.phone);
    var actions = confirmId === o.id
      ? [h('span', {}, 'تمسحي الطلب ده؟'),
         h('button', {type:'button', class:'btn sm danger', onclick:function(){remove(o)}}, 'أيوه، امسح'),
         h('button', {type:'button', class:'btn sm', onclick:function(){confirmId = null; renderList()}}, 'لا')]
      : [h('button', {type:'button', class:'badge' + (o.done ? ' done' : ''), 'aria-pressed':String(!!o.done), onclick:function(){toggleDone(o)}}, o.done ? 'اتسلم ✓' : 'لسه'),
         h('span', {class:'sp'}),
         h('button', {type:'button', class:'btn sm', onclick:function(){startEdit(o)}}, 'تعديل'),
         h('button', {type:'button', class:'btn sm danger', onclick:function(){confirmId = o.id; renderList()}}, 'مسح')];
    return h('li', {class:'card order'},
      thumbs(o),
      h('div', {class:'body'},
        h('div', {class:'top'},
          h('div', {class:'name'}, o.name || 'من غير اسم'),
          o.size ? h('span', {class:'chip size'}, o.size) : null,
          o.color ? h('span', {class:'chip'}, o.color) : null,
          o.source === 'web' && !o.done ? h('span', {class:'chip new'}, 'من الموقع') : null,
          late ? h('span', {class:'chip late'}, 'الاستلام متأخر') : null),
        o.phone ? h('div', {class:'contact'}, h('bdi', {dir:'ltr'}, o.phone),
          wa ? h('a', {class:'btn sm', href:wa, target:'_blank', rel:'noopener'}, 'واتساب') : null) : null,
        h('div', {class:'nums'}, h('div', {class:'num'}, h('span', {}, 'السعر'), h('b', {}, o.price ? money(o.price) : 'لسه متحددش'))),
        (o.payDate || o.pickupDate) ? h('div', {class:'dates'},
          o.payDate ? h('span', {}, 'الدفع: ', h('b', {}, fmtDate(o.payDate))) : null,
          o.pickupDate ? h('span', {}, 'الاستلام: ', h('b', {}, fmtDate(o.pickupDate))) : null) : null,
        o.notes ? h('div', {class:'notes'}, o.notes) : null,
        h('div', {class:'acts'}, actions)));
  }
  function renderStats(){
    var sales = 0, delivered = 0;
    orders.forEach(function(o){sales += Number(o.price)||0; if (o.done) delivered++});
    var s = $('stats'); s.textContent = '';
    [[String(orders.length), 'عدد الطلبات', ''], [money(sales), 'إجمالي المبيعات', ''],
     [String(delivered), 'اتسلم', 'good'], [String(orders.length - delivered), 'لسه متسلمش', '']].forEach(function(p){
      s.append(h('div', {class:'stat'}, h('b', {class:p[2]}, p[0]), h('span', {}, p[1])));
    });
  }
  function renderList(){
    var list = $('list'); list.textContent = '';
    var q = query.trim().toLowerCase();
    var shown = orders.filter(function(o){
      if (filter === 'open' && o.done) return false;
      if (filter === 'done' && !o.done) return false;
      if (!q) return true;
      return ((o.name||'') + ' ' + (o.phone||'') + ' ' + (o.color||'')).toLowerCase().indexOf(q) !== -1;
    });
    if (!loaded){
      list.append(h('li', {class:'empty'}, 'بحمّل الطلبات...'));
    } else if (!orders.length){
      list.append(h('li', {class:'card empty'}, h('b', {}, 'لسه مفيش طلبات'), 'أي طلب يبعته عميل من صفحة الطلب هيظهر هنا لوحده.'));
    } else if (!shown.length){
      list.append(h('li', {class:'empty'}, 'مفيش طلبات بالشكل ده.'));
    } else {
      shown.forEach(function(o){list.append(card(o))});
    }
  }

  /* ---------- export ---------- */
  function csvCell(v){return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'}
  function exportCsv(){
    var rows = [['الاسم', 'الموبايل', 'اللون', 'المقاس', 'السعر', 'وقت الدفع', 'ميعاد الاستلام', 'الحالة', 'ملاحظات']];
    orders.forEach(function(o){
      rows.push([o.name, o.phone, o.color, o.size, o.price || 0, o.payDate, o.pickupDate, o.done ? 'اتسلم' : 'لسه', o.notes]);
    });
    var txt = '﻿' + rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([txt], {type:'text/csv;charset=utf-8'}));
    a.download = 'everafter-orders.csv';
    document.body.append(a); a.click(); a.remove();
  }

  /* ---------- auth + data ---------- */
  function loginErr(msg){var e = $('loginErr'); e.textContent = msg || ''; e.hidden = !msg}
  function listen(){
    if (unsub) return;
    loaded = false; renderStats(); renderList();
    var timer = setTimeout(function(){if (!loaded) notice('الطلبات لسه مجتش، اتأكدي من النت.')}, 10000);
    unsub = fs.onSnapshot(fs.query(fs.collection(db, 'orders'), fs.orderBy('createdAt', 'desc')), function(snap){
      orders = snap.docs.map(function(d){var x = d.data() || {}; x.id = d.id; return x});
      loaded = true; clearTimeout(timer); notice('');
      renderStats(); renderList();
    }, function(){
      loaded = true; clearTimeout(timer);
      notice('الحساب ده مش مسموح له يشوف الطلبات، أو القواعد (Rules) مش منشورة صح.');
      renderList();
    });
  }
  async function login(ev){
    ev.preventDefault();
    var email = $('email').value.trim(), pass = $('pass').value;
    if (!email || !pass){loginErr('اكتبي الإيميل والباسورد'); return}
    loginErr(''); $('loginBtn').disabled = true;
    try{await au.signInWithEmailAndPassword(auth, email, pass)}
    catch(e){loginErr('الإيميل أو الباسورد غلط')}
    finally{$('loginBtn').disabled = false}
  }
  async function init(){
    try{
      var mods = await Promise.all([import(FB_APP), import(FB_FS), import(FB_AUTH)]);
      fs = mods[1]; au = mods[2];
      var app = mods[0].initializeApp(FB_CFG);
      db = fs.getFirestore(app); auth = au.getAuth(app);
    }catch(e){loginErr('معرفتش أحمّل Firebase. اتأكدي من النت وجرّبي تاني.'); return}
    au.onAuthStateChanged(auth, function(user){
      if (user){
        $('login').hidden = true; $('app').hidden = false;
        listen();
      } else {
        if (unsub){unsub(); unsub = null}
        orders = []; $('app').hidden = true; $('login').hidden = false;
      }
    });
  }

  /* ---------- wiring ---------- */
  buildSlots();
  $('login').addEventListener('submit', login);
  $('f').addEventListener('submit', save);
  $('newBtn').addEventListener('click', function(){
    resetForm(); $('payDate').value = todayStr(); showForm(true);
    $('f').scrollIntoView({behavior:'smooth', block:'start'}); $('name').focus();
  });
  $('cancelBtn').addEventListener('click', function(){resetForm(); showForm(false)});
  $('csvBtn').addEventListener('click', exportCsv);
  $('logoutBtn').addEventListener('click', function(){if (au) au.signOut(auth)});
  $('q').addEventListener('input', function(e){query = e.target.value; renderList()});
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(t){t.setAttribute('aria-pressed', String(t === b))});
    renderList();
  });
  $('lb').addEventListener('click', function(){$('lb').hidden = true});
  document.addEventListener('keydown', function(e){if (e.key === 'Escape') $('lb').hidden = true});
  renderStats(); renderList();
  init();
})();
</script>
</body>
</html>
